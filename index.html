<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Birthday Race</title>


<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
}


/* =========================================
   SCENES
========================================= */

.scene {
    position: absolute;

    width: 100%;
    height: 100vh;

    top: 0;
    left: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    transition:
        left 1.2s cubic-bezier(.77,0,.18,1);
}

.scene.active {
    left: 0;
}

.scene.previous {
    left: -100%;
}


/* =========================================
   SCENE 1
========================================= */

#scene1 {

    background:
        radial-gradient(
            circle at center,
            #181818,
            #030303 70%
        );
}

.hero-content {
    text-align: center;
    z-index: 5;
}

.small-title {

    color: #ed2024;

    letter-spacing: 6px;

    font-weight: bold;

    margin-bottom: 15px;
}

.ready {

    font-size:
        clamp(25px, 5vw, 55px);

    font-weight: 800;

    letter-spacing: 8px;
}

.surprise-title {

    margin-top: 10px;

    color: #e21c23;

    font-size:
        clamp(35px, 7vw, 80px);

    font-style: italic;

    font-weight: 900;
}


/* =========================================
   CAR
========================================= */

.car {

    width: 500px;
    max-width: 85vw;

    height: 200px;

    margin: 20px auto;

    position: relative;
}

.car-body {

    position: absolute;

    bottom: 30px;

    left: 5%;

    width: 90%;

    height: 100px;

    background:
        linear-gradient(
            #222,
            #030303
        );

    border-radius:
        50% 50% 15% 15%;

    border: 2px solid #333;
}

.car-window {

    position: absolute;

    width: 45%;

    height: 60px;

    top: 20px;

    left: 27%;

    background: #080b0e;

    clip-path:
        polygon(
            15% 100%,
            30% 0,
            70% 0,
            85% 100%
        );
}

.light {

    position: absolute;

    width: 75px;
    height: 20px;

    top: 65px;

    background: white;

    box-shadow:
        0 0 25px #fff;
}

.light.left {
    left: 8%;
}

.light.right {
    right: 8%;
}

.wheel {

    position: absolute;

    width: 60px;
    height: 60px;

    bottom: 0;

    border-radius: 50%;

    background: #000;

    border: 8px solid #222;
}

.wheel.left {
    left: 15%;
}

.wheel.right {
    right: 15%;
}


/* =========================================
   START BUTTON
========================================= */

.start {

    width: 120px;
    height: 120px;

    border-radius: 50%;

    border: 4px solid #ed2024;

    background: #050505;

    color: white;

    font-weight: bold;

    cursor: pointer;

    font-size: 16px;

    box-shadow:
        0 0 20px
        rgba(255,0,0,.4);

    transition: .3s;
}

.start:hover {

    transform: scale(1.08);

    box-shadow:
        0 0 40px red;
}


/* =========================================
   SCENE 2 — RACE
========================================= */

#scene2 {

    background:
        linear-gradient(
            #060606,
            #101010
        );
}


/* Road */

.road {

    position: absolute;

    bottom: 15%;

    width: 100%;

    height: 4px;

    background: #777;

    box-shadow:
        0 40px #222,
        0 80px #111;

    transform:
        perspective(400px)
        rotateX(55deg);
}


/* Race car */

.race-car {

    position: absolute;

    left: -350px;

    bottom: 25%;

    width: 330px;

    height: 120px;

    transition:
        left 4s
        cubic-bezier(.2,.7,.2,1);
}

.race-car.drive {

    left: 110%;
}

.race-body {

    position: absolute;

    bottom: 20px;

    width: 100%;

    height: 65px;

    background:
        linear-gradient(
            160deg,
            #242424,
            #030303
        );

    border-radius:
        50% 20% 15% 15%;

    border: 1px solid #444;
}

.race-window {

    position: absolute;

    width: 50%;

    height: 45px;

    left: 25%;

    top: 5px;

    background: #050708;

    clip-path:
        polygon(
            15% 100%,
            30% 0,
            75% 0,
            100% 100%
        );
}

.race-wheel {

    position: absolute;

    bottom: 0;

    width: 45px;

    height: 45px;

    border-radius: 50%;

    background: #000;

    border: 7px solid #222;
}

.race-wheel.one {
    left: 18%;
}

.race-wheel.two {
    right: 12%;
}


/* Race text */

.race-text {

    position: relative;

    z-index: 5;

    text-align: center;

    transition:
        opacity .8s,
        transform .8s;
}

.race-text h1 {

    font-size:
        clamp(40px, 7vw, 80px);

    font-style: italic;

    line-height: 1;
}

.race-text span {

    color: #ed2024;
}


/* =========================================
   SCENE 3 — BIRTHDAY
========================================= */

#scene3 {

    background:
        radial-gradient(
            circle at center,
            rgba(100,0,0,.25),
            #000 70%
        );

    text-align: center;
}

.birthday h1 {

    font-size:
        clamp(55px, 10vw, 110px);

    font-style: italic;

    line-height: .9;
}

.birthday h1 span {

    color: #ed2024;
}

.champion {

    margin: 25px 0;

    color: #e4b94d;

    font-family: cursive;

    font-size:
        clamp(40px, 7vw, 70px);
}

.wishes {

    max-width: 750px;

    margin: auto;

    color: #ddd;

    font-size: 15px;

    line-height: 2;

    letter-spacing: 3px;
}

.replay {

    margin-top: 40px;

    padding: 13px 30px;

    background: transparent;

    color: white;

    border: 1px solid #777;

    cursor: pointer;

    letter-spacing: 3px;
}

.replay:hover {

    border-color: #ed2024;

    color: #ed2024;
}


/* =========================================
   SOUND BUTTON
========================================= */

.sound {

    position: fixed;

    z-index: 100;

    top: 20px;

    left: 20px;

    background:
        rgba(0,0,0,.7);

    color: white;

    border: 1px solid #555;

    padding: 9px 14px;

    cursor: pointer;

    font-size: 11px;
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:600px) {

    .ready {
        letter-spacing: 3px;
    }

    .car {
        transform: scale(.75);
    }

    .race-car {
        transform: scale(.7);
    }

    .wishes {
        width: 90%;
        font-size: 12px;
    }

}

</style>

</head>


<body>


<!-- SOUND -->

<button
    class="sound"
    id="soundButton"
>
    🔊 SOUND ON
</button>



<!-- =========================================
     SCENE 1
========================================= -->

<section
    class="scene active"
    id="scene1"
>

    <div class="hero-content">

        <div class="small-title">
            HEY...
        </div>

        <div class="ready">
            READY FOR YOUR
        </div>

        <div class="surprise-title">
            BIRTHDAY SURPRISE?
        </div>


        <div class="car">

            <div class="car-body"></div>

            <div class="car-window"></div>

            <div class="light left"></div>

            <div class="light right"></div>

            <div class="wheel left"></div>

            <div class="wheel right"></div>

        </div>


        <button
            class="start"
            id="startButton"
        >
            START<br>
            ENGINE
        </button>

        <div style="
            margin-top:15px;
            font-size:10px;
            letter-spacing:3px;
            color:#aaa;
        ">
            CLICK TO START
        </div>

    </div>

</section>



<!-- =========================================
     SCENE 2 — RACE START
========================================= -->

<section
    class="scene"
    id="scene2"
>

    <div class="road"></div>


    <div
        class="race-car"
        id="raceCar"
    >

        <div class="race-body"></div>

        <div class="race-window"></div>

        <div class="race-wheel one"></div>

        <div class="race-wheel two"></div>

    </div>


    <div
        class="race-text"
        id="raceText"
    >

        <h1>

            THIS RIDE IS

            <br>

            <span>
                JUST GETTING
                <br>
                STARTED...
            </span>

        </h1>

    </div>

</section>



<!-- =========================================
     SCENE 3 — BIRTHDAY
========================================= -->

<section
    class="scene"
    id="scene3"
>

    <div class="birthday">

        <h1>

            HAPPY

            <br>

            <span>
                BIRTHDAY 🎂
            </span>

        </h1>


        <div class="champion">
           YOU HAVE WON THE RACE Champion 🎉 🥳
        </div>


        <div class="wishes">

            WISHING YOU A YEAR FULL OF

            <br>

            SPEED, SUCCESS

            <br>

            AND BEAUTIFUL MEMORIES 😊

       <br>  Please do not find BUGS 😛 </br>  

        </div>


        <button
            class="replay"
            id="replay"
        >
            ↻ &nbsp; REPLAY
        </button>

    </div>

</section>



<script>

/* =========================================
   ELEMENTS
========================================= */

const startButton =
    document.getElementById("startButton");

const scene1 =
    document.getElementById("scene1");

const scene2 =
    document.getElementById("scene2");

const scene3 =
    document.getElementById("scene3");

const raceCar =
    document.getElementById("raceCar");

const replay =
    document.getElementById("replay");

const soundButton =
    document.getElementById("soundButton");


let audioContext = null;

let oscillator = null;

let gain = null;

let soundOn = true;


/* =========================================
   CHANGE SCENE
========================================= */

function showScene(scene) {

    document
        .querySelectorAll(".scene")
        .forEach(function(item) {

            item.classList.remove(
                "active",
                "previous"
            );

        });


    scene.classList.add("active");
}


/* =========================================
   ENGINE SOUND
========================================= */

function startEngineSound() {

    if (!soundOn)
        return;


    audioContext =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();


    oscillator =
        audioContext.createOscillator();


    gain =
        audioContext.createGain();


    oscillator.type =
        "sawtooth";


    /*
       Engine starts low
    */

    oscillator.frequency.setValueAtTime(
        55,
        audioContext.currentTime
    );


    /*
       Rev up
    */

    oscillator.frequency.exponentialRampToValueAtTime(
        150,
        audioContext.currentTime + 1
    );


    /*
       Driving RPM
    */

    oscillator.frequency.exponentialRampToValueAtTime(
        90,
        audioContext.currentTime + 4
    );


    gain.gain.setValueAtTime(
        0.001,
        audioContext.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
        0.20,
        audioContext.currentTime + .2
    );


    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );


    oscillator.start();
}


/* =========================================
   START EXPERIENCE
========================================= */

startButton.addEventListener(
    "click",
    function() {


        /* -----------------------------
           1. ENGINE SOUND
        ----------------------------- */

        startEngineSound();


        /* -----------------------------
           2. GO TO RACE SCENE
        ----------------------------- */

        setTimeout(function() {

            showScene(scene2);

            /*
               Start car after scene
               transition begins
            */

            setTimeout(function() {

                raceCar.classList.add(
                    "drive"
                );

            }, 500);

        }, 700);


        /* -----------------------------
           3. GO TO BIRTHDAY
        ----------------------------- */

        setTimeout(function() {

            showScene(scene3);

            stopEngineSound();

        }, 5200);

    }
);


/* =========================================
   STOP SOUND
========================================= */

function stopEngineSound() {

    if (
        !audioContext ||
        !oscillator
    )
        return;


    try {

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioContext.currentTime + .5
        );


        setTimeout(function() {

            try {
                oscillator.stop();
            }
            catch(e) {}

        }, 600);

    }
    catch(e) {}

}


/* =========================================
   SOUND ON/OFF
========================================= */

soundButton.addEventListener(
    "click",
    function() {

        soundOn =
            !soundOn;


        if (soundOn) {

            soundButton.innerHTML =
                "🔊 SOUND ON";

            if (gain) {
                gain.gain.value =
                    .20;
            }

        }
        else {

            soundButton.innerHTML =
                "🔇 SOUND OFF";

            if (gain) {
                gain.gain.value =
                    0;
            }

        }

    }
);


/* =========================================
   REPLAY
========================================= */

replay.addEventListener(
    "click",
    function() {


        stopEngineSound();


        raceCar.classList.remove(
            "drive"
        );


        showScene(scene1);


    }
);

</script>


</body>
</html>
